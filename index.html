<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>AI Song Finder 🎵</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" href="https://img.icons8.com/emoji/48/musical-notes.png" />
      </head>
      
<body>
  <div class="container">
    <h1>🎶 AI Song Finder</h1>
    <p>Enter a song title and artist to discover the lyrics!</p>
    
    <div class="input-group">
      <input type="text" id="artist" placeholder="Artist name" />
      <input type="text" id="title" placeholder="Song title" />
      <button onclick="findLyrics()">Find Lyrics</button>
<script src="script.js"></script>

    </div>

    <div class="output" id="lyricsDisplay">
      <p>Lyrics will appear here...</p>
    </div
